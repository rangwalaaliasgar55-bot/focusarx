<!DOCTYPE html>

    <!-- Pre-paint theme: mirrors lib/theme.ts getTheme/applyTheme for the two
         default themes so light-mode users never see a dark flash. Premium
         variable overrides are applied by React right after (same values). -->
    <script>
      try {
        if (localStorage.getItem("focusarx-theme") === "light") {
          document.documentElement.classList.add("light");
        } else {
          document.documentElement.classList.add("dark");
        }
      } catch (e) { /* private mode: React defaults to dark */ }
    </script>

    <!-- ══════════════════════════════════════════════════════════
         CANONICAL — Single source of truth
         Canonical host is www: https://www.focusarx.site
         Deployment requirement: the Vercel primary domain must be
         www.focusarx.site so the apex 308-redirects here (see the
         `redirects` entry in vercel.json). If a canonical below ever
         points at the apex, it points at a redirect and Google refuses
         to index the page — the failure mode behind the "Discovered –
         currently not indexed" backlog.
    ══════════════════════════════════════════════════════════════ -->
    <link rel="canonical" href="https://www.focusarx.site/" />
    <!-- ══════════════════════════════════════════════════════════
         HREFLANG — audience annotations for a single English edition
         FocusArx publishes ONE English edition: there are no /in/ or /uk/
         URL trees, so every alternate below resolves to the same canonical.
         That is deliberate and it is what Google's documentation allows for
         a single-URL language edition — the annotations declare the intended
         audiences (India first, then the wider English-speaking world) and
         x-default is the fallback. Two rules keep this honest:

           • all alternates in the cluster must be self-consistent and point
             at a live 200 URL, never at a redirect — scripts/prerender.mjs
             rewrites all four per page and scripts/seo-validate.mjs fails the
             build if any page's cluster disagrees with its canonical;
           • if locale-specific URLs are ever added (a real /in/ edition, not
             a query parameter), these must be repointed at them, because a
             cluster of four identical URLs is a signal, not a duplicate-content
             workaround.

         scripts/prerender.mjs replaces this block per prerendered page;
         src/components/PageSEO.tsx keeps it current on client-side
         navigation so the DOM and the static HTML never disagree.
    ══════════════════════════════════════════════════════════════ -->
    <link rel="alternate" hreflang="x-default" href="https://www.focusarx.site/" />

    <!-- ══════════════════════════════════════════════════════════
         RESOURCE HINTS — warm the connections the app actually uses.
         dns-prefetch/preconnect shave 100-300ms off the first request to
         each origin by overlapping DNS + TCP + TLS with page parse.
    ══════════════════════════════════════════════════════════════ -->
    <!-- Fonts are self-hosted (@fontsource) — no fonts.gstatic.com connection needed. -->
    <link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin />
    <link rel="dns-prefetch" href="https://tpc.googlesyndication.com" />
    <!-- images.unsplash.com used to be pre-fetched here for two hotlinked hero
         illustrations; both are self-hosted WebP now (public/content/), so the
         third-party connection is gone with them. -->

    <!-- Google tag (gtag.js) — installed once for every FocusArx route.
         Direct gtag.js is a deliberate choice, not a missing GTM install: one
         tag, no container round-trip, no duplicate loader. Do NOT add a GTM
         container snippet without removing this block — two Google tags on one
         page double-count page views and fight over the _ga cookie. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PXMVX28PL5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      // ── Consent Mode v2 ────────────────────────────────────────────
      // Must run BEFORE `config`, or the first hit is sent with no consent
      // state at all and Google treats it as "no signal" instead of an
      // explicit choice.
      //
      //   ad_storage / ad_user_data / ad_personalization → denied.
      //     FocusArx runs no Google Ads today and AdSense (which is on this
      //     page) does its own TCF consent. Declaring these denied keeps the
      //     door open for Google Ads later without ever implying consent we
      //     did not collect — the requirement behind India's DPDP Act and the
      //     EEA/UK rules Google enforces from March 2024.
      //   analytics_storage → granted.
      //     First-party measurement only: IP is anonymised below, no cross-site
      //     identifier is set, the notice is shown on first visit
      //     (components/CookieConsent.tsx) and "Essential only" flips this to
      //     denied. Denying it by default instead would silently drop the
      //     sign_up / session_complete key events for every visitor who never
      //     interacts with the banner.
      //
      // CookieConsent.tsx calls `gtag("consent", "update", …)` from the same
      // shared helper (src/lib/consent.ts) when the visitor chooses — the two
      // files must not grow separate consent logic.
      gtag("consent", "default", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: "granted",
        functionality_storage: "granted",
        personalization_storage: "denied",
        security_storage: "granted",
        wait_for_update: 500,
      });

      gtag("js", new Date());
      // SPA route changes are reported by SiteAnalyticsTracker. Disabling the
      // automatic view here prevents the initial route from being counted twice.
      // Cookie fields are explicit (not relying on gtag defaults) so identity
      // survives across www/apex and long gaps between visits: the _ga cookie
      // lives on the root domain for the full 2 years GA4 allows.
      gtag("config", "G-PXMVX28PL5", {
        send_page_view: false,
        anonymize_ip: true,
        cookie_domain: "auto",
        cookie_expires: 63072000,
        cookie_flags: "SameSite=Lax;Secure",
        cookie_update: true,
      });
    </script>

    <!-- ══════════════════════════════════════════════════════════
         GOOGLE ADSENSE
         - `async` so it never blocks first paint
         - `id` + the window flag let src/components/AdSense.tsx detect that
           the loader is already present and skip a duplicate injection
         - requires /ads.txt (public/ads.txt) and the googlesyndication /
           doubleclick origins allowlisted in the server CSP
    ══════════════════════════════════════════════════════════════ -->
    <script
      id="adsbygoogle-js"
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3831356027941619"
      crossorigin="anonymous"
      onload="window.__adsbygoogleLoaded=true"></script>
