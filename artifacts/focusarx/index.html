            "@type": "Answer",
            "text": "FocusArx is an AI-powered productivity platform that combines Pomodoro focus sessions, deep work tracking, AI coaching, gamification (XP, coins, streaks), and habit building to help students and professionals build unbreakable focus habits."

        {
          "@type": "Question",
          "name": "Is FocusArx free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, FocusArx is free forever. The core Pomodoro timer, task management, streaks, and basic analytics are completely free. Premium features like advanced AI coaching and exclusive themes can be unlocked using coins earned by focusing — no credit card required."
          }
        },
        {
          "@type": "Question",
          "name": "How does the AI coach work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "FocusArx's AI coach analyzes your focus sessions, habits, and productivity patterns to provide personalized insights, study recommendations, and motivational guidance. It adapts to your work style and helps you optimize your deep work sessions."
          }
        },
        {
          "@type": "Question",
          "name": "What is the Pomodoro technique?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Pomodoro technique is a time management method developed by Francesco Cirillo. It involves working in focused 25-minute intervals (called 'pomodoros') separated by short breaks. FocusArx implements this with adaptive timers that adjust to your focus patterns."
          }
        },
        {
          "@type": "Question",
          "name": "Does FocusArx track my webcam?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "FocusArx uses optional on-device webcam attention monitoring via MediaPipe. All processing happens locally on your device — no video data is ever sent to our servers. Your privacy is fully protected."
          }
        },
        {
          "@type": "Question",
          "name": "What is Focus DNA?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Focus DNA is FocusArx's personalized focus analysis system. It studies your session data, focus quality, and productivity patterns to generate a unique focus profile with insights about your peak hours, session preferences, and improvement areas."
          }
        },
        {
          "@type": "Question",
          "name": "Can I study with friends on FocusArx?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! FocusArx offers virtual study rooms where you can study alongside other learners in real-time. You can join public rooms or create private rooms with friends for accountability and group focus multipliers."
          }
        },
        {
          "@type": "Question",
          "name": "How do streaks and gamification work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "FocusArx rewards you with XP, coins, and streak badges for completing focus sessions and maintaining daily habits. You can spend coins on marketplace items, loot boxes, and premium features. The gamification system keeps you motivated through achievements and leaderboards."
          }
        },
        {
          "@type": "Question",
          "name": "Is there a FocusArx mobile app?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "FocusArx is available as a progressive web app (PWA) that works on any device with a browser. You can install it on your home screen for an app-like experience. It also supports Capacitor for native iOS and Android builds."
          }
        },
        {
          "@type": "Question",
          "name": "How do I cancel my FocusArx Premium?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "FocusArx Premium is activated using earned coins, not subscriptions. There is nothing to cancel. If your Premium expires, you can reactivate it anytime by earning more coins through focus sessions."
          }
        }
      ]
    }
