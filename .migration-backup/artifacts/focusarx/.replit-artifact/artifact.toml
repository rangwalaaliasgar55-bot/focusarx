kind = "web"
previewPath = "/"
title = "Focusarx"
version = "1.0.0"
id = "artifacts/focusarx"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20925

[services.development]
run = "pnpm --filter @workspace/focusarx run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/focusarx", "run", "build" ]
publicDir = "artifacts/focusarx/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20925"
BASE_PATH = "/"
