name: Production Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.26.1"

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Pre-flight: full CI suite before touching the database or production
  # ──────────────────────────────────────────────────────────────────────────────
  preflight:
    name: Pre-flight checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deployment_id: ${{ steps.version.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Generate deployment version
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "id=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Deployment version: ${SHA}"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit + contract tests
        run: pnpm run test

      - name: Build (API)
        run: pnpm --filter @workspace/api-server run build

      - name: Build (Frontend)
        run: pnpm --filter @workspace/focusarx run build
        env:
          VITE_APP_URL: https://focusarx.site
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}

  # ──────────────────────────────────────────────────────────────────────────────
  # Database migration (runs before Vercel activates the new build)
  # ──────────────────────────────────────────────────────────────────────────────
  migrate:
    name: Database migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify production environment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          MISSING=""
          [ -z "$DATABASE_URL" ] && MISSING="${MISSING} DATABASE_URL"
          [ -z "$AUTH_SECRET" ] && MISSING="${MISSING} AUTH_SECRET"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required env vars:${MISSING}"
            exit 1
          fi
          if [ "${#AUTH_SECRET}" -lt 32 ]; then
            echo "::error::AUTH_SECRET must be at least 32 characters."
            exit 1
          fi
          echo "All required environment variables present."

      - name: Configure database URL
        id: config
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
          DB_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        run: |
          # Prefer the direct (non-pooling) URL on Vercel: prepared statements
          # are used by Drizzle and break under transaction-mode poolers.
          if [ -n "$DB_URL_NON_POOLING" ]; then
            echo "url=${DB_URL_NON_POOLING}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${DB_URL}" >> "$GITHUB_OUTPUT"
          fi

      - name: Acquire migration lock
        env:
          DATABASE_URL: ${{ steps.config.outputs.url }}
        run: |
          node -e "
            const { Pool } = require('pg');
            const pool = new Pool({ connectionString: process.env.DATABASE_URL });
            (async () => {
              try {
                await pool.query(\"CREATE TABLE IF NOT EXISTS _migration_lock (id boolean PRIMARY KEY DEFAULT true, locked_at timestamptz, locked_by text, CHECK (id))\");
                const { rows } = await pool.query(\"INSERT INTO _migration_lock (id, locked_at, locked_by) VALUES (true, NOW(), \$1) ON CONFLICT (id) DO UPDATE SET locked_at = NOW(), locked_by = EXCLUDED.locked_by WHERE _migration_lock.locked_at < NOW() - INTERVAL '30 minutes' RETURNING *\", ['github-actions-${{ github.sha }}']);
                if (rows.length === 0) {
                  console.error('Could not acquire migration lock — another deployment may be running.');
                  process.exit(1);
                }
                console.log('Migration lock acquired.');
                await pool.end();
              } catch(e) {
                console.error('Lock acquisition failed:', e.message);
                process.exit(1);
              }
            })();
          "

      - name: Run migrations
        env:
          DATABASE_URL: ${{ steps.config.outputs.url }}
        run: |
          pnpm --filter @workspace/db run push

      - name: Release migration lock
        if: always()
        env:
          DATABASE_URL: ${{ steps.config.outputs.url }}
        run: |
          node -e "
            const { Pool } = require('pg');
            const pool = new Pool({ connectionString: process.env.DATABASE_URL });
            (async () => {
              try {
                await pool.query(\"UPDATE _migration_lock SET locked_at = NULL, locked_by = NULL WHERE id = true\");
                console.log('Migration lock released.');
                await pool.end();
              } catch(e) {
                console.warn('Lock release failed (non-fatal):', e.message);
              }
            })();
          "

      - name: Post-migration health check
        env:
          DATABASE_URL: ${{ steps.config.outputs.url }}
        run: |
          node -e "
            const { Pool } = require('pg');
            const pool = new Pool({ connectionString: process.env.DATABASE_URL });
            (async () => {
              try {
                const { rows } = await pool.query('SELECT 1 as ok');
                if (rows[0].ok !== 1) throw new Error('Health check failed');
                console.log('Database health check passed.');
                await pool.end();
              } catch(e) {
                console.error('Health check failed:', e.message);
                process.exit(1);
              }
            })();
          "

  # ──────────────────────────────────────────────────────────────────────────────
  # Deploy to Vercel after migrations are applied
  # ──────────────────────────────────────────────────────────────────────────────
  vercel-deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: migrate
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured. Add it in GitHub Settings → Secrets and Actions."
            exit 1
          fi
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_ORG_ID and VERCEL_PROJECT_ID are required. Run 'vercel link' locally to get them."
            exit 1
          fi
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

  # ──────────────────────────────────────────────────────────────────────────────
  # Post-deploy smoke test against the live URL
  # ──────────────────────────────────────────────────────────────────────────────
  smoke:
    name: Post-deployment smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: vercel-deploy
    env:
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - name: Health endpoint smoke test
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::warning::APP_URL secret not set — skipping live smoke test."
            exit 0
          fi
          echo "Waiting for deployment to propagate..."
          sleep 30
          echo "Smoke test: ${APP_URL}/api/healthz"
          curl -fsS --retry 5 --retry-delay 5 "${APP_URL}/api/healthz"
          echo
          echo "Smoke test passed."
