name: Production Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.26.1"

jobs:
  preflight:
    name: Pre-flight checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deployment_id: ${{ steps.version.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Generate deployment version
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "id=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Deployment version: ${SHA}"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit + contract tests
        run: pnpm run test

      - name: Build (API)
        run: pnpm --filter @workspace/api-server run build

      - name: Build (Frontend)
        run: pnpm --filter @workspace/focusarx run build
        env:
          VITE_APP_URL: https://www.focusarx.site
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}

  # ──────────────────────────────────────────────────────────────────────────────
  # Database schema sync (additive, non-interactive) — runs BEFORE the new code
  # is activated so a query for a new column never meets a database without it.
  #
  # The repository's GitHub environment is named `Production` (capital P). This
  # job previously targeted `production`, which does not exist: GitHub created
  # an empty environment on the fly, every `secrets.*` reference resolved to an
  # empty string, and all 30 consecutive deploy runs failed in the pre-flight
  # step with "Missing required env vars" — that is the "database push failed"
  # notification. The secrets themselves were never the problem.
  # ──────────────────────────────────────────────────────────────────────────────
  migrate:
    name: Database migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    environment: Production
    outputs:
      ran: ${{ steps.check.outputs.ran }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check database credentials
        id: check
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
          DB_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        run: |
          # Only the database URL is needed to sync the schema. AUTH_SECRET,
          # ADMIN_PASSWORD and APP_URL are runtime settings that live in Vercel;
          # requiring them here blocked every deploy for a check that protects
          # nothing in this job.
          if [ -z "$DB_URL" ] && [ -z "$DB_URL_NON_POOLING" ]; then
            echo "::warning::DATABASE_URL / POSTGRES_URL_NON_POOLING are not set in the 'Production' GitHub environment — skipping the schema sync here. The Vercel build (pnpm run build:vercel) still syncs the schema before the new code goes live."
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$DB_URL_NON_POOLING" ]; then
            echo "url=${DB_URL_NON_POOLING}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${DB_URL}" >> "$GITHUB_OUTPUT"
          fi
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - name: Sync database schema (additive only)
        if: steps.check.outputs.ran == 'true'
        env:
          DATABASE_URL: ${{ steps.check.outputs.url }}
        # `sync` = cleanup-orphans + sync-schema: every missing table, column,
        # index and constraint is created; nothing is ever dropped, retyped or
        # truncated, and there is no interactive prompt to hang on. Changes that
        # need a human decision are printed as MANUAL and do not fail the job.
        run: pnpm --filter @workspace/db run sync

  # Production is deployed by Vercel's Git integration on every push to main;
  # this job is only for repositories that disabled that and deploy by token.
  # Without a token it skips cleanly instead of failing the whole workflow.
  vercel-deploy:
    name: Vercel production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: migrate
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via Vercel CLI (only when a token is configured)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN is not configured — production is deployed by Vercel's Git integration. Nothing to do here."
            exit 0
          fi
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_ORG_ID and VERCEL_PROJECT_ID are required alongside VERCEL_TOKEN. Run 'vercel link' locally to get them."
            exit 1
          fi
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

  smoke:
    name: Post-deployment smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: vercel-deploy
    environment: Production
    env:
      APP_URL: ${{ secrets.APP_URL || vars.APP_URL || 'https://www.focusarx.site' }}
    steps:
      - name: Health and readiness smoke test
        run: |
          echo "Waiting for the deployment to propagate..."
          sleep 45
          echo "Smoke test: ${APP_URL}/api/healthz"
          curl -fsS --retry 5 --retry-delay 10 -A "focusarx-deploy-smoke/1.0 (GitHub Actions)" "${APP_URL}/api/healthz"
          echo
          # `ready` also proves the database answers and the runtime config is
          # complete — the two things a schema-sync deploy can break.
          echo "Readiness: ${APP_URL}/api/healthz/ready"
          curl -fsS --retry 5 --retry-delay 10 -A "focusarx-deploy-smoke/1.0 (GitHub Actions)" "${APP_URL}/api/healthz/ready"
          echo
          echo "Smoke test passed."
