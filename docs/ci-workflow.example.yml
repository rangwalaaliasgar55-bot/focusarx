# FocusArx CI pipeline (minimal variant; kept as a reference).
# The active pipeline is .github/workflows/ci.yml (source of truth:
# docs/ci-workflows/ci.yml). If the committed workflow does not run because it
# was pushed without the 'workflows' permission, copy this file (or the full
# one in docs/ci-workflows/) into .github/workflows/ci.yml with your own
# account — see docs/PRODUCTION_SETUP.md §6.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check migration naming and duplicate versions
        run: |
          test -n "$(find lib/db/drizzle -maxdepth 1 -name '*.sql' -print -quit)"
          duplicates="$(find lib/db/drizzle -maxdepth 1 -name '[0-9][0-9][0-9][0-9]_*.sql' -printf '%f\n' | cut -c1-4 | sort | uniq -d)"
          test -z "$duplicates" || { echo "Duplicate migration versions: $duplicates"; exit 1; }
      - run: pnpm audit --prod --audit-level high

  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:a11y

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
